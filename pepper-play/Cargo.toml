[package]
name = "pepper-play"
version = "0.4.0"
edition = "2024"
description = "Plays video inside Pepper (Ghostty with inline video), through libmpv"
# The source. libmpv, loaded at run time, is GPL as Homebrew builds it (see
# README.md).
license = "MIT"
publish = false

[[bin]]
name = "pepper-play"
path = "src/main.rs"

[profile.release]
strip = true
# A panic stops the program at once rather than unwinding: unwinding past the
# render thread's live libmpv render context (or an FFI callback) would leave
# libmpv freeing a context in use.
panic = "abort"
